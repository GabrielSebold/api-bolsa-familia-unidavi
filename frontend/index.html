<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Painel com os repasses do Bolsa Família por município, a partir de dados públicos do Portal da Transparência." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bolsa Família em números</title>
    <script>
      // Aplica o tema antes do 1º render para evitar flash.
      (function () {
        var pref = 'auto';
        try {
          var salvo = localStorage.getItem('bf:tema');
          if (salvo === 'claro' || salvo === 'escuro' || salvo === 'auto') pref = salvo;
        } catch (e) {}
        var escuro = pref === 'escuro';
        if (pref === 'auto') {
          try {
            escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
        }
        var tema = escuro ? 'escuro' : 'claro';
        var raiz = document.documentElement;
        raiz.setAttribute('data-theme', tema);
        raiz.style.colorScheme = escuro ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
